backend:
  name: github
  repo: aliwali8475-debug/vehari-photo-stat-website
  branch: main
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple
collections:
  - name: "website"
    label: "Website Content"
    files:
      - name: "site"
        label: "Business Details, Services & Equipment"
        file: "content/site.yml"
        format: "yaml"
        fields:
          - { label: "Business Name", name: "business_name", widget: "string" }
          - { label: "Homepage Tagline", name: "tagline", widget: "string" }
          - { label: "About Heading", name: "about_title", widget: "string" }
          - { label: "About Description", name: "about_text", widget: "text" }
          - { label: "Shop Address", name: "address", widget: "string" }
          - { label: "Phone Display", name: "phone_display", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp_number", widget: "string", hint: "Country code, no plus. Example: 923193560375" }
          - { label: "Business Hours", name: "hours", widget: "string" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service Name", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Icon / Emoji", name: "icon", widget: "string", required: false }
          - label: "Machines & Equipment"
            name: "machines"
            widget: "list"
            fields:
              - { label: "Machine Name", name: "name", widget: "string" }
              - { label: "Description", name: "detail", widget: "text" }
              - { label: "Icon / Emoji", name: "icon", widget: "string", required: false }
